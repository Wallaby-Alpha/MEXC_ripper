services:
  mexc-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mexc-momentum-scanner
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist SQLite market cache, processed datasets, and scanner alerts across restarts
      - ./data:/app/data
      - ./reports:/app/reports
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
